{% extends 'learniva_app/base.html' %}
{% block content %}
    <h2>Вхід</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="hidden" name="next" value="{{ next }}">
        <button type="submit" class="btn">Увійти</button>
    </form>
    <p>Немає акаунта? <a href="{% url 'signup' %}">Зареєструватися</a></p>
    <div class="social">
        <ul>
            <li class="google">
                <form action="{% url 'social:begin' 'google-oauth2' %}" method="post">
                    {% csrf_token %}
                    <input type="hidden" name="next" value="{{ next }}">
                    <button type="submit" class="btn">Увійти через Google</button>
                </form>
            </li>
        </ul>
    </div>
{% endblock %}
