{% extends 'learniva_app/base.html' %}
{% block content %}
    <h2>Реєстрація</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn">Зареєструватися</button>
         <div class="social">
        <ul>
            <li class="google">
                <form action="{% url 'social:begin' 'google-oauth2' %}" method="post">
                    {% csrf_token %}
                    <input type="hidden" name="next" value="{{ next }}">
                    <button type="submit" class="btn">Зареєструватися через Google</button>
                </form>
            </li>
        </ul>
    </div>
    </form>
{% endblock %}
